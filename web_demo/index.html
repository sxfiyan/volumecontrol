<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Gesture Volume Control - Live Web Demo</title>
  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: radial-gradient(circle at top center, #1e293b, #0f172a);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      max-width: 1200px;
      width: 100%;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .video-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    video {
      display: none; /* Processed via Canvas */
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
    }

    .hud-badge {
      position: absolute;
      top: 2.5rem;
      left: 2.5rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--accent-cyan);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-cyan);
    }

    .vol-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .vol-percentage {
      font-size: 3.5rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px var(--accent-cyan);
    }

    .vol-bar-outer {
      width: 100%;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    .vol-bar-inner {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      border-radius: 12px;
      transition: width 0.1s ease-out;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #fff;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .sim-slider {
      width: 100%;
      margin-top: 1rem;
      accent-color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <header>
    <h1>Hand Gesture Volume Control</h1>
    <p>Real-Time Computer Vision & Hand Landmark Distance Tracking</p>
  </header>

  <div class="container">
    <!-- Camera Viewport Card -->
    <div class="video-card">
      <div class="hud-badge">
        <i class="fa-solid fa-camera"></i> <span id="statusText">Camera Loading...</span>
      </div>

      <div class="canvas-wrapper">
        <video id="webcam" playsinline></video>
        <canvas id="outputCanvas" width="640" height="480"></canvas>
      </div>

      <button id="startCamBtn" class="btn"><i class="fa-solid fa-video"></i> Start Webcam Feed</button>
    </div>

    <!-- Sidebar Control Panel -->
    <div class="sidebar">
      <!-- Volume Indicator -->
      <div class="panel-card">
        <div class="panel-title">
          <i class="fa-solid fa-volume-high"></i> System Volume Output
        </div>
        <div class="vol-display">
          <div class="vol-percentage" id="volText">50%</div>
          <div class="vol-bar-outer">
            <div class="vol-bar-inner" id="volBar"></div>
          </div>
        </div>
        <button id="audioTestBtn" class="btn btn-secondary"><i class="fa-solid fa-music"></i> Enable Audio Tone Test</button>
      </div>

      <!-- Simulator Panel -->
      <div class="panel-card">
        <div class="panel-title">
          <i class="fa-solid fa-sliders"></i> Distance Simulator
        </div>
        <p style="font-size: 0.9rem; color: #94a3b8;">Simulate thumb-index pinch distance manually:</p>
        <input type="range" id="distanceSlider" class="sim-slider" min="20" max="220" value="120">
        <div style="display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.85rem; color: #cbd5e1;">
          <span>Pinch (Min)</span>
          <span id="distVal">120 px</span>
          <span>Spread (Max)</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');

    const statusText = document.getElementById('statusText');
    const volText = document.getElementById('volText');
    const volBar = document.getElementById('volBar');
    const startCamBtn = document.getElementById('startCamBtn');
    const audioTestBtn = document.getElementById('audioTestBtn');
    const distanceSlider = document.getElementById('distanceSlider');
    const distVal = document.getElementById('distVal');

    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isAudioPlaying = false;
    let camera = null;

    // Web Audio Synthesizer setup for real-time audio testing
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // 440 Hz (A4)
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
      }
    }

    audioTestBtn.addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isAudioPlaying = !isAudioPlaying;
      if (isAudioPlaying) {
        audioTestBtn.innerHTML = '<i class="fa-solid fa-stop"></i> Stop Audio Tone Test';
        audioTestBtn.style.borderColor = 'var(--accent-green)';
      } else {
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        audioTestBtn.innerHTML = '<i class="fa-solid fa-music"></i> Enable Audio Tone Test';
      }
    });

    function updateVolume(percent) {
      const pct = Math.max(0, Math.min(100, Math.round(percent)));
      volText.textContent = `${pct}%`;
      volBar.style.width = `${pct}%`;

      if (isAudioPlaying && gainNode && audioCtx) {
        gainNode.gain.setValueAtTime(pct / 100, audioCtx.currentTime);
      }
    }

    // Manual slider handler
    distanceSlider.addEventListener('input', (e) => {
      const dist = parseFloat(e.target.value);
      distVal.textContent = `${Math.round(dist)} px`;
      const pct = ((dist - 20) / (200 - 20)) * 100;
      updateVolume(pct);
    });

    // MediaPipe Hands Processing
    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusText.textContent = 'Tracking Hand Gesture';
        const landmarks = results.multiHandLandmarks[0];

        // Mirror coordinates because camera is mirrored
        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];

        const x1 = (1 - thumbTip.x) * canvasElement.width;
        const y1 = thumbTip.y * canvasElement.height;
        const x2 = (1 - indexTip.x) * canvasElement.width;
        const y2 = indexTip.y * canvasElement.height;

        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;

        const distance = Math.hypot(x2 - x1, y2 - y1);

        // Draw Line between thumb and index
        canvasCtx.beginPath();
        canvasCtx.moveTo(x1, y1);
        canvasCtx.lineTo(x2, y2);
        canvasCtx.strokeStyle = distance < 35 ? '#10b981' : '#06b6d4';
        canvasCtx.lineWidth = 4;
        canvasCtx.stroke();

        // Draw circles at endpoints
        canvasCtx.beginPath();
        canvasCtx.arc(x1, y1, 8, 0, 2 * Math.PI);
        canvasCtx.arc(x2, y2, 8, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#8b5cf6';
        canvasCtx.fill();

        // Center dot
        canvasCtx.beginPath();
        canvasCtx.arc(cx, cy, distance < 35 ? 12 : 8, 0, 2 * Math.PI);
        canvasCtx.fillStyle = distance < 35 ? '#10b981' : '#f59e0b';
        canvasCtx.fill();

        // Map distance to volume percentage (min 20px -> 0%, max 180px -> 100%)
        const volPct = ((distance - 20) / (180 - 20)) * 100;
        updateVolume(volPct);
        distanceSlider.value = Math.min(220, Math.max(20, distance));
        distVal.textContent = `${Math.round(distance)} px`;
      } else {
        statusText.textContent = 'Hand Not Detected';
      }

      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    startCamBtn.addEventListener('click', () => {
      if (!camera) {
        statusText.textContent = 'Initializing Camera...';
        camera = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        camera.start();
        startCamBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
